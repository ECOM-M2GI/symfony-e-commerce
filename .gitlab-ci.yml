sonarcloud-check:
  stage: code_quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [ "" ]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  tags:
    - Parallelized
  rules:
    - changes:
        - '**/*'
      when: always
    - when: never


tf_validate:
  stage: code_quality
  extends: .tf_env
  script:
    - terraform validate
  rules:
    - changes:
        - 'tf/**/*'
      when: always
    - when: never

tf_format:
  stage: code_quality
  extends: .tf_env
  allow_failure: true
  script:
    - terraform fmt -check -recursive
  rules:
    - changes:
        - 'tf/**/*'
      when: always
    - when: never

################

test_backend:
  stage: test
  extends: .python_testing_env
  needs:
    - code_check_backend 1/3
    - code_check_backend 2/3
    - code_check_backend 3/3
  script:
    - uv run pytest -v --durations=0 --cov --cov-report=xml --junitxml=report.xml
  cache:
    <<: *cache_backend
  artifacts:
    when: always
    reports:
      junit: ${BACKEND_DIR}/report.xml
      coverage_report:
        coverage_format: cobertura
        path: ${BACKEND_DIR}/coverage.xml
  coverage: '/^\d+.\d+% coverage/'
  rules:
    # - !reference [ .refuse_exec_on_main_only, rules ]
    - changes:
        - 'backend/**/*'
      when: always
    - when: never

sast:
  stage: test
  needs: []
  tags:
    - Linux
include:
  - template: Security/SAST.gitlab-ci.yml


################

apply_essentials:
  stage: deploy
  extends: .tf_env
  needs:
    - job: tf_format
      optional: true
    - job: tf_validate
      optional: true
    - job: test_backend
      optional: true # if there are no tests, do not block
  script:
    - terraform apply -target=module.vpc -target=module.essentials -target=module.ecr -input=false -auto-approve
    - echo "ECR_REPO=$(terraform output -raw backend_repo_url)" >> $TF_DIR/ecr.env
  artifacts:
    paths:
      - $TF_DIR/ecr.env
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - changes:
        - 'tf/**/*'
        - 'backend/**/*'
        - 'frontend/**/*'
      when: always
    - when: manual

################

build_backend:
  stage: deploy
  extends: .docker_aws_env
  needs:
    - job: apply_essentials
  script:
    - source $TF_DIR/ecr.env
    - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REPO}
    - cd ${BACKEND_DIR}
    - docker build -t ${ECR_REPO}:latest .
    - docker push ${ECR_REPO}:latest
  cache:
    <<: *cache_backend
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - changes:
        - 'backend/**/*'
        - 'tf/backend/**/*'
      when: always
    - when: manual
      allow_failure: true

################

apply_backend:
  extends: .tf_env
  stage: deploy
  needs:
    - job: apply_essentials
    - job: build_backend
      optional: true
  script:
    - terraform apply -target=module.backend -input=false -auto-approve
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - changes:
        - 'tf/backend/**/*'
        - 'backend/**/*'
      when: always
    - when: manual

apply_frontend:
  extends: .tf_env
  stage: deploy
  needs:
    - job: apply_essentials
  script:
    - terraform apply -target=module.frontend -input=false -auto-approve
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - changes:
        - 'tf/frontend/**/*'
        - 'frontend/**/*'
      when: always
    - when: manual

deploy_frontend:
  extends: .node_aws_tf_env
  stage: deploy
  needs:
    - job: apply_essentials
    - job: apply_frontend
    - job: apply_backend
  script:
    - cd ${TF_DIR}
    - terraform init -reconfigure
    - terraform refresh
    - export API_URL="$(terraform output -raw backend_api_url)/api/"
    - cd ${FRONTEND_DIR}
    - npm install
    - echo "API_URL is ${API_URL}"
    - npm run build -- --configuration production
    - cd ${TF_DIR}
    - aws s3 sync ${FRONTEND_DIR}/dist/${PROJECT_NAME}/browser s3://$(terraform output -raw frontend_s3_bucket_name) --delete
    - aws cloudfront create-invalidation --distribution-id $(terraform output -raw cloudfront_distribution_id) --paths "/*"
    - echo "Frontend Deployed at https://$(terraform output -raw frontend_domain_name)"
  cache:
      <<: *cache_font
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - changes:
        - 'frontend/**/*'
      when: always
    - when: manual
      allow_failure: true

#################

destroy_ecr:
  stage: danger_zone
  extends: .tf_env
  needs:
    - [ ]
  script:
    - terraform destroy -target=module.ecr -auto-approve -input=false --force
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - when: manual

destroy_front:
  stage: destroy
  extends: .tf_env
  needs:
    - [ ]
  script:
    - terraform destroy -target=module.frontend -auto-approve -input=false
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - when: manual

destroy_backend:
  stage: destroy
  extends: .tf_env
  needs:
    - [ ]
  script:
    - terraform destroy -target=module.backend -auto-approve -input=false
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - when: manual

destroy_database:
  stage: danger_zone
  extends: .tf_env
  needs:
    - [ ]
  script:
    - terraform destroy -target=module.database -auto-approve -input=false
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - when: manual

destroy_all:
  stage: danger_zone
  extends: .tf_env
  needs:
    - [ ]
  script:
    - terraform destroy -auto-approve -input=false --force
  rules:
    - !reference [ .allow_exec_on_main_only, rules ]
    - when: manual
