# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

variables:
  TF_DIR: ${CI_PROJECT_DIR}/tf
  BACKEND_DIR: ${CI_PROJECT_DIR}/backend
  FRONTEND_DIR: ${CI_PROJECT_DIR}/frontend
  PROJECT_NAME: "ebey"
  ENVIRONMENT: "prod" # remove later if not needed
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - code_quality
  - test
  - deploy
  - destroy
  - danger_zone

.docker_aws_env:
  image: docker:28.4
  services:
    - docker:28.4-dind
  before_script:
    - docker info
    - apk add --no-cache curl jq python3 py3-pip pipx
    - pipx install awscli
    - export PATH=$PATH:/root/.local/bin
    - aws --version
  tags:
    - Docker_dind

.tf_env:
  variables:
    TF_IN_AUTOMATION: 1
  image:
    name: hashicorp/terraform:1.13
    entrypoint: [ "" ]
  before_script:
    - export TF_VAR_project_name=$PROJECT_NAME
    - export TF_VAR_region=$AWS_REGION
    - export TF_VAR_environment=$ENVIRONMENT
    - export TF_VAR_stripe_secret_key=$STRIPE_SECRET_KEY
    - export TF_VAR_stripe_webhook_secret=$STRIPE_WEBHOOK_SECRET
    - terraform --version
    - cd ${TF_DIR}
    - terraform init -reconfigure
  cache:
    key: ${CI_COMMIT_REF_NAME}
    paths:
      - ${TF_DIR}/.terraform
    policy: pull-push
  tags:
    # we don't want parallelism for terraform
    - Serialized

.node_aws_tf_env:
  variables:
    TF_IN_AUTOMATION: 1
  extends: .node_env
  before_script:
    - export TF_VAR_project_name=$PROJECT_NAME
    - export TF_VAR_region=$AWS_REGION
    - export TF_VAR_environment=$ENVIRONMENT
    - export TF_VAR_stripe_secret_key=$STRIPE_SECRET_KEY
    - export TF_VAR_stripe_webhook_secret=$STRIPE_WEBHOOK_SECRET
    - npm --version
    - apt-get update && apt-get install -y wget python3-pip pipx gnupg software-properties-common
    - wget -O - https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
    - apt update && apt install terraform
    - pipx install awscli
    - export PATH=$PATH:/root/.local/bin
    - aws --version
  tags:
    - Parallelized

.python_env:
  image: python:3.13
  before_script:
    - python --version
    - cd ${BACKEND_DIR}
    - pip install uv
    - uv sync
  tags:
    - Parallelized

.python_testing_env:
  extends: .python_env
  before_script:
    - python --version
    - cd ${BACKEND_DIR}
    - pip install uv
    - uv sync
    - uv add pytest pytest-cov mypy django-stubs djangorestframework-stubs

.node_env:
  image: node:24
  before_script:
    - npm --version
  tags:
    - Parallelized

.frontend_env:
  extends: .node_env
  before_script:
    - npm --version
    - cd ${FRONTEND_DIR}
    - npm i

################

.allow_exec_on_main_only:
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never

.refuse_exec_on_main_only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never


################


.cache_backend:
  cache: &cache_backend
    key: backend-${CI_COMMIT_BRANCH}
    paths:
      - ${BACKEND_DIR}/.venv

.cache_font:
  cache: &cache_font
    key: font-${CI_COMMIT_BRANCH}
    paths:
      - ${FRONTEND_DIR}/node_modules
      - ${TF_DIR}/.terraform

################

code_check_backend 1/3:
  stage: code_quality
  extends: .python_testing_env
  script:
    - uvx ruff check
  cache:
    <<: *cache_backend
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      allow_failure: true
    - changes:
        - 'backend/**/*'
      when: always
    - when: never

code_check_backend 2/3:
  stage: code_quality
  extends: .python_testing_env
  script:
    - uvx ruff format --check .
  cache:
    <<: *cache_backend
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      allow_failure: true
    - changes:
        - 'backend/**/*'
      when: always
    - when: never

code_check_backend 3/3:
  stage: code_quality
  extends: .python_testing_env
  script:
    - uv run mypy .
  cache:
    <<: *cache_backend
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      allow_failure: true
    - changes:
        - 'backend/**/*'
      when: always
    - when: never

code_check_front:
  stage: code_quality
  extends: .frontend_env
  script:
    - npm i angular-eslint -D
    - npm run ng add angular-eslint
    - npm run ng lint
  cache:
    <<: *cache_font
  rules:
#    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH # oops
#      allow_failure: true
    - allow_failure: true
    - changes:
        - 'frontend/**/*'
      when: always
    - when: never

