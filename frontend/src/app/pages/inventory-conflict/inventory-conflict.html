<div class="flex w-full flex-col items-center min-h-screen bg-gray-50 py-8">
  <div class="flex flex-col card bg-white rounded-[24px] w-full max-w-6xl shadow-lg p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="flex items-center justify-center mb-4">
        <svg
          class="w-16 h-16 text-orange-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
      </div>
      <h1 class="title-1 text-gray-900 mb-2">Produits Indisponibles</h1>
      <p class="text-lg text-gray-600">
        Certains produits dans votre panier ne sont plus disponibles en quantité suffisante et ont
        été retirés.<br />
        Veuillez retourner a votre panier pour continuer.
      </p>
    </div>

    <app-loading [isLoading]="isLoading()">
      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button type="button" class="btn btn-error px-8 py-3" (click)="goToCart()">
          Retour au Panier
        </button>
      </div>
    </app-loading>
  </div>
</div>
