<form
  [formGroup]="loginForm"
  (ngSubmit)="login()"
  #form
  class="border-1 rounded-xl border-border p-6 max-w-[400px] mx-auto"
>
  <h2 class="font-semibold text-2xl">Se connecter</h2>

  <div class="flex flex-col gap-x-3 mt-4">
    <label [for]="fieldNames.username" class="label-required">Nom d'utilisateur</label>
    <input
      [id]="fieldNames.username"
      type="text"
      required
      class="text-input w-full"
      formControlName="username"
    />
  </div>
  <div class="flex flex-col mt-4">
    <label [for]="fieldNames.password" class="label-required">Mot de passe</label>
    <input
      [id]="fieldNames.password"
      required=""
      type="password"
      class="text-input w-full"
      formControlName="password"
    />
  </div>
  <button type="submit" class="btn btn-neutral w-full mt-6">Se connecter</button>
</form>
