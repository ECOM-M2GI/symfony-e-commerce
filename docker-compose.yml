services:
  backend-dev:
    build:
      context: backend/
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      DB_HOST: mariadb
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /

  backend-prod:
    build:
      context: backend/
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    env_file:
      - .env.local
    environment:
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-annonces}
      MYSQL_USER: ${LOCAL_DB_USER:-user}
      MYSQL_PASSWORD: ${LOCAL_DB_USER_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb:/var/lib/mariadb/data
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p${LOCAL_DB_ROOT_PASSWORD:-rootpassword}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  angular-dev:
    build:
      context: frontend/
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - API_URL=http://localhost:8000/api/
      - STRIPE_PUBLISHABLE_KEY=pk_test_51S6S0NRuasokNTVWHlHwo3Pz8nkSNeqNmuGo0BoV2A3XE1iHMDK6UmCLRyLUMfblZxMvdqLGg2s9eAn7EoQF8abt00p7A4FSVR
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - node_modules/

  #The apache service
  webserver:
    build:
      context: docker/apache/
      dockerfile: Dockerfile
    ports:
      - "8080:80"

volumes:
  mariadb:
