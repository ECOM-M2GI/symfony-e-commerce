<VirtualHost *:80> 
    ServerName localhost
    # Sets the server name (here: localhost)

    # Forward Authorization header to PHP/Symfony
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    DocumentRoot /var/www/html
    # Sets the root folder for requests (here: the Angular build)

    Alias /api /var/www/api/public
    # Requests to /api are mapped to the Symfony public folder

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
        # Allows access to all files in the Angular folder
        # Rewrite rules disabled for dev: frontend is served by frontend-dev on port 4200
    </Directory>

    <Directory /var/www/api/public>
        AllowOverride None
        Require all granted
        # Allows access to all files in the Symfony folder

        <IfModule mod_rewrite.c>
            RewriteEngine On
            # Enables the URL rewrite engine

            RewriteCond %{REQUEST_FILENAME} !-f
            # If the requested file does not physically exist

            RewriteRule ^(.*)$ index.php [QSA,L]
            # All requests are redirected to index.php (Symfony)
        </IfModule>
    </Directory>
</VirtualHost>
