name: Build and deploy API
on:
  push:
    tags:
      - 'api-*'

jobs:
  build:
    if: github.ref_type == 'tag' && github.ref_name =~ /^api-\d+\.\d+$/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          if ! git branch -r --contains ${{ github.sha }} | grep -q 'origin/main'; then
            echo "Error: Tag must be on main branch"
            exit 1
          fi

      - name: Setup CI environment
        run: cp api/.env.ci api/.env.local

      - name: Install dependencies
        uses: "php-actions/composer@v6"
        env:
          COMPOSER: "composer.json"
        with:
          php_version: "8.2"
          args: "--ignore-platform-reqs --optimize-autoloader --no-interaction"
          working_dir: "api"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: api/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: build

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_API_SERVER }}
          username: ${{ secrets.FTP_API_USER }}
          password: ${{ secrets.FTP_API_PWD }}
          local-dir: ./
          protocol: ftps
