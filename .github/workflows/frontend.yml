name: Build and deploy front-end
on:
  push:
    tags:
      - 'frontend-*'
env:
  API_URL: https://ecom-api.babolat-loic.fr

jobs:
  build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'frontend-')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^frontend-[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must match frontend-X.X format"
            exit 1
          fi

      - name: Verify tag is on main branch
        run: |
          if ! git branch -r --contains ${{ github.sha }} | grep -q 'origin/main'; then
            echo "Error: Tag must be on main branch"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install dependencies
        # run in frontend directory and use npm ci only
        working-directory: frontend
        run: |
          npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy will only run when build ran (build already gated by merged check)
    steps:
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: dist

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_FRONT_SERVER }}
          username: ${{ secrets.FTP_FRONT_USER }}
          password: ${{ secrets.FTP_FRONT_PWD }}
          local-dir: ./ebey/browser/
          protocol: ftps
