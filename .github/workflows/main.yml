name: Build and deploy front-end
on:
  pull_request: 
    branches:
      - front-prod
    types: [closed]
env:
  API_URL: https://annonces-api.babolat-loic.fr

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
  
      - name: Clean install dependencies
        run: |
          cd ./frontend
          npm ci
          npm install --no-save
  
      - name: Build (production)
        run: npm run build

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/
          retention-days: 1
        
  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps: 
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: dist

    
