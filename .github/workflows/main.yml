name: Build and deploy front-end
on:
  pull_request: 
    branches:
      - front-prod
    types: [closed]
env:
  API_URL: https://annonces-api.babolat-loic.fr


jobs:
  build:
    # Run only when the pull request was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
  
      - name: Clean install dependencies
        # run in frontend directory and use npm ci only
        working-directory: frontend
        run: |
          npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/
          retention-days: 1
        
  deploy:
    
    needs: build
    runs-on: ubuntu-latest
    # deploy will only run when build ran (build already gated by merged check)
    steps:
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: dist

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_FRONT_SERVER }}
          username: ${{ secrets.FTP_FRONT_USER }}
          password: ${{ secrets.FTP_FRONT_PWD }}
          local-dir: ./dist/ebey/browser/
          protocol: ftps
